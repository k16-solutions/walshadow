name: Chart

# Lints and renders charts/walshadow on pull requests. On main, publishes the
# chart to ECR as an OCI artifact, once per Chart.yaml version.
#
# Repository variables:
#   CHART_REGISTRY          ECR registry host, eg 123456789012.dkr.ecr.us-east-2.amazonaws.com
#   CHART_PUBLISH_ROLE_ARN  IAM role GitHub OIDC assumes to push to <registry>/charts/walshadow

on:
  pull_request:
    paths:
      - charts/**
      - .github/workflows/chart.yml
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/chart.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: charts/walshadow
  HELM_VERSION: v3.17.3
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint
        run: |
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm lint --strict "$CHART_DIR" -f "$values"
          done

      - name: Validate rendered manifests
        run: |
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            echo "::group::$values"
            helm template walshadow "$CHART_DIR" --namespace walshadow -f "$values" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Required values are enforced
        run: |
          if helm template walshadow "$CHART_DIR" >/dev/null 2>&1; then
            echo "rendering with no values should fail" >&2
            exit 1
          fi

  publish:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.CHART_REGISTRY }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Read chart version
        id: chart
        run: |
          test -n "$REGISTRY" || { echo "CHART_REGISTRY is not set" >&2; exit 1; }
          version=$(helm show chart "$CHART_DIR" | awk '$1 == "version:" {print $2}')
          name=$(helm show chart "$CHART_DIR" | awk '$1 == "name:" {print $2}')
          region=${REGISTRY#*.dkr.ecr.}
          region=${region%%.*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CHART_PUBLISH_ROLE_ARN }}
          aws-region: ${{ steps.chart.outputs.region }}

      - name: Push unless this version exists
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          NAME: ${{ steps.chart.outputs.name }}
        run: |
          if out=$(aws ecr describe-images --repository-name "charts/$NAME" \
                --image-ids "imageTag=$VERSION" 2>&1); then
            echo "charts/$NAME:$VERSION is already published; bump version in Chart.yaml to publish"
            exit 0
          elif ! grep -q ImageNotFoundException <<<"$out"; then
            echo "$out" >&2
            exit 1
          fi
          aws ecr get-login-password | helm registry login --username AWS --password-stdin "$REGISTRY"
          helm package "$CHART_DIR" --destination dist
          helm push "dist/$NAME-$VERSION.tgz" "oci://$REGISTRY/charts"
          echo "Published oci://$REGISTRY/charts/$NAME:$VERSION" >> "$GITHUB_STEP_SUMMARY"
